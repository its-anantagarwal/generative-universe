<style>body{margin:0;overflow:hidden}</style><canvas id=c></canvas><script>
c.width=innerWidth
c.height=innerHeight
x=c.getContext('2d')

S=[]
P=[]

for(i=0;i<300;i++)
 S.push([Math.random()*c.width,Math.random()*c.height,Math.random()*2])

for(i=0;i<8;i++)
 P.push([
  Math.random()*c.width,
  Math.random()*c.height,
  5+Math.random()*15,
  [20,35,50,200,190,0][Math.random()*6|0],
  Math.random()<.3
 ])

function draw(){
 x.fillStyle='#000'
 x.fillRect(0,0,c.width,c.height)

 for(s of S){
  x.fillStyle=`rgba(255,255,255,${.3+Math.random()*.7})`
  x.fillRect(s[0],s[1],s[2],s[2])
 }

 for(p of P){
  X=p[0];Y=p[1];R=p[2]
  g=x.createRadialGradient(X-R/3,Y-R/3,0,X,Y,R)
  g.addColorStop(0,'#fff')
  g.addColorStop(1,`hsl(${p[3]},50%,35%)`)
  x.fillStyle=g
  x.beginPath()
  x.arc(X,Y,R,0,7)
  x.fill()

  if(p[4]){
   x.strokeStyle='#aaa'
   x.lineWidth=2
   x.beginPath()
   x.ellipse(X,Y,R*1.7,R*.45,0,0,7)
   x.stroke()
  }
 }

 requestAnimationFrame(draw)
}

draw()
</script>
